<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Расчёт для инвестора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Расчёт для инвестора<small>Артикулы · товар · движение денег</small></div>
    <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Загрузка…</span></span>
    <span class="pill" id="rolePill"></span>
    <button class="btn ghost sm" id="btnReload" type="button">Обновить</button>
    <button class="btn ghost sm" id="btnSettings" type="button">Подключение</button>
    <button class="btn ghost sm" id="btnLogout" type="button" hidden>Выйти</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Разделы" id="tabs"></nav>
  <div class="toolbar" id="toolbar"></div>
  <main id="view" aria-live="polite"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/calc.js"></script>
<script src="js/store.js"></script>
<script src="js/access.js"></script>
<script src="js/app.js"></script>
</body>
</html>
